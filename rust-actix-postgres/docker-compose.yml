version: '3.8'

services:
  app:
    build: .
    container_name: rust-app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/keploy
      - RUST_LOG=info
    depends_on:
      - db
    networks:
      - keploy-network

  db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=keploy
    ports:
      - "5432:5432"
    networks:
      - keploy-network

networks:
  keploy-network:
    driver: bridge
